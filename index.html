<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anmeldung abgeschlossen</title>
<style>
  :root { --bg:#ffffff; --text:#1b1f3b; --karte:#f3f1fa; --rand:#cfc8ea; --knopf:#7c5cd6; --knopf-text:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14162b; --text:#f1f0fa; --karte:#1f2142; --rand:#3a3d6b; --knopf:#9b82f0; --knopf-text:#14162b; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.5; }
  main { max-width:560px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  .karte { background:var(--karte); border:1px solid var(--rand); border-radius:12px; padding:16px; margin:16px 0; }
  code { display:block; word-break:break-all; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.95rem; }
  button { background:var(--knopf); color:var(--knopf-text); border:0; border-radius:10px; padding:12px 18px; font-size:1rem; cursor:pointer; }
  .klein { font-size:.9rem; opacity:.85; }
</style>
</head>
<body>
<main>
  <h1 id="titel">Anmeldung</h1>
  <p id="text">Einen Moment ...</p>

  <div class="karte" id="codekarte" hidden>
    <strong>Dein Code:</strong>
    <code id="code"></code>
  </div>
  <button id="kopieren" hidden>Code kopieren</button>

  <p class="klein">Diese Seite speichert nichts und schickt nichts weiter. Gib den Code niemandem, außer deinem eigenen Programm.</p>
</main>

<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  var code = p.get("code");
  var fehler = p.get("error_description") || p.get("error");
  var titel = document.getElementById("titel");
  var text = document.getElementById("text");

  if (code) {
    titel.textContent = "Fertig, die Anmeldung hat geklappt";
    text.textContent = "Kopiere den Code und füge ihn in dein Programm ein.";
    document.getElementById("code").textContent = code;
    document.getElementById("codekarte").hidden = false;
    var knopf = document.getElementById("kopieren");
    knopf.hidden = false;
    knopf.addEventListener("click", function () {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(function () { knopf.textContent = "Kopiert"; });
      }
    });
  } else if (fehler) {
    titel.textContent = "Die Anmeldung hat nicht geklappt";
    text.textContent = "TikTok meldet: " + fehler;
  } else {
    titel.textContent = "Rückleitungsseite";
    text.textContent = "Diese Seite wird von TikTok nach der Anmeldung aufgerufen. Hier gibt es sonst nichts zu sehen.";
  }
})();
</script>
</body>
</html>
